version: "2"
sql:
  - engine: "postgresql"
    queries: "postgres/queries.sql"
    schema: "postgres/migrations"
    gen:
      go:
        package: "pg"
        out: "../db/sqlc/postgres"
        sql_package: "database/sql"
  - engine: "sqlite"
    queries: "sqlite/queries.sql"
    schema: "sqlite/migrations"
    gen:
      go:
        package: "sqlite"
        out: "../db/sqlc/sqlite"
        sql_package: "database/sql"